<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUALT | Student Information System</title>

<link rel="stylesheet" href="css/app.css">
</head>

<body>
<header>
  <div class="brand">
    QUALT
    <small>STUDENT INFORMATION SYSTEM</small>
  </div>

  <div class="row">
    <button id="theme" type="button">Dark mode</button>
    <button id="signout" type="button" hidden>Sign out</button>
  </div>
</header>

<main id="auth" class="card auth">
  <p class="eyebrow">Your campus, connected</p>
  <h1 id="auth-title">Welcome back</h1>
  <p id="auth-subtitle" class="muted">Sign in to your QUALT account.</p>

  <form id="login-form">
    <label class="field">
      <span>Email address</span>
      <input
        id="email"
        type="email"
        autocomplete="username"
        maxlength="254"
        required
        autocapitalize="none"
      >
    </label>

    <label class="field">
      <span>Password</span>
      <div class="password">
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >
        <button
          id="show-password"
          type="button"
          aria-label="Show password"
          aria-pressed="false"
        >Show</button>
      </div>
    </label>

    <div class="row spread">
      <label class="check">
        <input id="remember" type="checkbox">
        Remember my email
      </label>
      <button id="forgot" type="button">Forgot password?</button>
    </div>

    <button class="primary" type="submit">Sign in</button>
  </form>

  <form id="change-form" hidden>
    <label class="field">
      <span>New password</span>
      <input
        id="new-password"
        type="password"
        autocomplete="new-password"
        required
      >
    </label>

    <label class="field">
      <span>Confirm new password</span>
      <input
        id="confirm-password"
        type="password"
        autocomplete="new-password"
        required
      >
    </label>

    <button class="primary" type="submit">Update password</button>
  </form>

  <p id="auth-message" class="message" role="alert"></p>
  <noscript>Please enable JavaScript to use this site.</noscript>
</main>

<p id="auth-footer" class="auth-footer">
  QUALT · Student Information System
</p>

<div id="app" class="shell" hidden>
  <aside>
    <nav id="nav" aria-label="Main navigation"></nav>
    <div id="account" class="account"></div>
  </aside>

  <main id="content" class="content" tabindex="-1"></main>
</div>

<dialog id="dialog" aria-labelledby="dialog-title">
  <div class="dialog-head">
    <h2 id="dialog-title"></h2>
    <button id="close-dialog" type="button" aria-label="Close dialog">
      Close
    </button>
  </div>
  <div id="dialog-body" class="dialog-body"></div>
</dialog>

<script type="module" src="js/main.js"></script>
</body>
</html>
